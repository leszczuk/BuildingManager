<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stan uruchomienia BMS</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.github.com; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B6477">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikona-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Układ: boczna lista widoków i pięter, środek z listami, z prawej wysuwany panel szczegółów.
   Na telefonie boczna lista staje się paskiem u góry, a panel zajmuje cały ekran. */
:root{
  --bg:#E7ECED; --surface:#F6F8F8; --raised:#FFFFFF; --line:#C8D2D5;
  --fg:#14232A; --muted:#566970;
  --accent:#0B6477; --accent-fg:#FFFFFF; --accent-soft:#D3E7EC;
  --ok:#1C7448; --ok-soft:#D6EDE0;
  --bad:#B0301E; --bad-soft:#F6DCD7;
  --warn:#8A5A00; --warn-soft:#F4E5C6;
  --hold:#6A4BA3; --hold-soft:#E6DEF3;
  --na:#687A80; --na-soft:#DDE4E6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --pw:640px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E171A; --surface:#152126; --raised:#1C2B31; --line:#2F4249;
    --fg:#E3ECEE; --muted:#93A6AC;
    --accent:#56BAD0; --accent-fg:#05222A; --accent-soft:#163A45;
    --ok:#5FC892; --ok-soft:#153526;
    --bad:#F28672; --bad-soft:#42211B;
    --warn:#E5B454; --warn-soft:#3B2F13;
    --hold:#B79BEA; --hold-soft:#2C2340;
    --na:#8C9DA3; --na-soft:#26353A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E171A; --surface:#152126; --raised:#1C2B31; --line:#2F4249;
  --fg:#E3ECEE; --muted:#93A6AC;
  --accent:#56BAD0; --accent-fg:#05222A; --accent-soft:#163A45;
  --ok:#5FC892; --ok-soft:#153526;
  --bad:#F28672; --bad-soft:#42211B;
  --warn:#E5B454; --warn-soft:#3B2F13;
  --hold:#B79BEA; --hold-soft:#2C2340;
  --na:#8C9DA3; --na-soft:#26353A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:34px;letter-spacing:.01em}
h2{font-size:23px;letter-spacing:.02em;text-transform:uppercase}
h3{font-size:19px;letter-spacing:.02em}
h4{font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-size:.92em;background:var(--na-soft);padding:0 4px;border-radius:3px;overflow-wrap:anywhere}
a.ref{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--accent)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;display:block}

/* ---------- szkielet ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:14px}
.brand{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;background:none;border-radius:4px;text-align:left;font-weight:600;font-size:14px}
.nv:hover{background:var(--na-soft)}
.nv[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
.nv .n{font-family:var(--mono);font-size:12px;font-weight:500;opacity:.85}
.nv.fl{font-weight:500;font-size:13px;padding:4px 10px 4px 22px}
.nv.fl .bar{width:44px;height:5px;flex:none}
.nv.fl .nm{flex:1;min-width:0}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.main{min-width:0;padding:22px 26px 90px}
.main-in{max-width:1200px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-direction:column;gap:4px}
.detail{position:fixed;top:0;right:0;bottom:0;width:min(var(--pw),100vw);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;z-index:20;box-shadow:-10px 0 28px rgba(0,0,0,.16);padding:14px 18px 70px;display:flex;flex-direction:column;gap:16px}
.backdrop{position:fixed;inset:0;background:rgba(10,20,25,.38);z-index:15}
@media (min-width:1500px){
  .backdrop{display:none!important}
  body.has-panel .main{margin-right:var(--pw)}
  .detail{box-shadow:none}
}
@media (max-width:900px){
  .shell{display:block}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:6px 10px;border-right:0;border-bottom:1px solid var(--line);gap:6px}
  .brand,.side-foot,.nv.fl{display:none}
  .nav{flex-direction:row;gap:2px}
  .nv{white-space:nowrap;width:auto;padding:8px 10px}
  .main{padding:14px 16px 80px}
  h1{font-size:28px}
}

/* ---------- elementy wspólne ---------- */
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px}
.bar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--na-soft);min-width:30px}
.bar i{display:block;height:100%}
.b-ok{background:var(--ok)} .b-part{background:repeating-linear-gradient(135deg,var(--ok) 0 3px,var(--ok-soft) 3px 6px)} .b-hold{background:var(--hold)} .b-bad{background:var(--bad)} .b-warn{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap}
.pill.bad{color:var(--bad);background:var(--bad-soft)} .pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)} .pill.hold{color:var(--hold);background:var(--hold-soft)}
.pill.na{color:var(--na);background:var(--na-soft)} .pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.ster{color:var(--fg);background:var(--surface);outline:1px solid var(--line);font-family:var(--mono)}
.io{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border:1px solid var(--line);border-radius:2px;letter-spacing:.03em;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--raised);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .n{font-family:var(--mono);font-size:11.5px;opacity:.8;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:4px;padding:8px 13px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-inline:6px}
.field{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-height:36px}
textarea.field{resize:vertical;min-height:60px;display:block}
.rowf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.glyph{width:20px;height:20px;display:block;flex:none}
.g-ok{color:var(--ok)} .g-czesc{color:var(--ok)} .g-blok{color:var(--hold)} .g-usterka{color:var(--bad)} .g-nd{color:var(--na)} .g-retest{color:var(--warn)} .g-brak{color:var(--na)} .g-none{color:var(--line)}
.sts{display:inline-flex;gap:3px;align-items:center}
.sts.lab{gap:3px}
.sts.lab span{width:20px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend .glyph{width:16px;height:16px}
.notice{background:var(--warn-soft);color:var(--fg);border-left:4px solid var(--warn);padding:10px 12px;border-radius:4px;font-size:13.5px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
ul.lines{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--raised)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--surface)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100% - 32px)}

/* ---------- budynek ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.kpi{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.kpi .big{font-family:var(--display);font-size:36px;font-weight:700;line-height:1}
.kpi .big small{font-size:18px;font-weight:500;color:var(--muted)}
.funnel{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) minmax(0,1.3fr);gap:8px 14px;align-items:center}
.funnel .fn{font-weight:600}
.funnel .bar{height:12px}
@media (max-width:760px){.funnel{grid-template-columns:1fr}.funnel .fc{margin-bottom:6px}}
.mc{display:flex;flex-direction:column;gap:3px;min-width:64px}
.mc .mono{font-size:12px}
td.mn{font-weight:600;white-space:nowrap}
td.mn .sub{font-weight:400;white-space:normal;display:block;max-width:230px}
.qrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--surface)}
.qid{font-family:var(--mono);font-weight:600}

/* ---------- lista urządzeń ---------- */
.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--raised);overflow:hidden}
.grp-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:center;padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.grp-h .cnt{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.minis{display:flex;gap:6px}
.mini{display:flex;flex-direction:column;gap:2px;align-items:stretch;width:34px}
.mini .bar{height:5px;min-width:0}
.mini span{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center;line-height:1}
.row{display:grid;grid-template-columns:104px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.1fr) 138px;gap:3px 14px;align-items:center;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface)}
.row.sel{background:var(--accent-soft)}
.row.hd{padding-block:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.r-id{font-family:var(--mono);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.r-name{font-weight:600;font-size:14px}
.r-sub{display:block;font-size:12.5px;color:var(--muted)}
.r-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.r-loc,.r-link{font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.r-st{justify-self:end}
@media (max-width:820px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row.hd{display:none}
  .r-id{grid-column:1;grid-row:1}
  .r-st{grid-column:2;grid-row:1}
  .r-main,.r-loc,.r-link{grid-column:1/-1}
}
.row.mini-r{grid-template-columns:96px minmax(0,1fr) minmax(0,.8fr) 138px}
@media (max-width:820px){.row.mini-r{grid-template-columns:minmax(0,1fr) auto}}

/* ---------- panel ---------- */
.p-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.p-top button{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.stage{border:1px solid var(--line);border-left-width:4px;border-radius:4px;background:var(--raised);padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.stage.s-ok{border-left-color:var(--ok)} .stage.s-czesc{border-left-color:var(--ok)} .stage.s-blok{border-left-color:var(--hold)}
.stage.s-usterka{border-left-color:var(--bad)} .stage.s-retest{border-left-color:var(--warn)} .stage.s-nd,.stage.s-brak{border-left-color:var(--na)}
.stage-h{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:flex-start}
.stage-t{flex:1 1 200px;min-width:0}
.stage-h b{font-size:14.5px}
.stage-h .stn{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap;padding-left:8px}
.verdict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.vb{border:1.5px solid var(--line);background:var(--raised);border-radius:4px;padding:7px 4px;font-weight:600;font-size:13px;min-height:36px}
.vb.ok{color:var(--ok)} .vb.fault{color:var(--bad)} .vb.na{color:var(--na)} .vb.nie{color:var(--fg)}
.vb.nie[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--raised)}
.vb.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--raised)}
.vb.fault[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--raised)}
.vb.na[aria-pressed="true"]{background:var(--na);border-color:var(--na);color:var(--raised)}
.vb.sm{min-height:28px;padding:3px 7px;font-size:12px}
.vrow{display:inline-flex;gap:4px}
.stamp{font-size:12px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px;margin:0}
.meta div{min-width:0}
.meta .wide{grid-column:1/-1}
.meta dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.step{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px}
.step input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.pkt{border-bottom:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.pkt:last-child{border-bottom:0}
.pkt .k{font-family:var(--mono);font-weight:600;font-size:13px}
.pkt .note{grid-column:1/-1}
.nieuz{opacity:.7}

/* ---------- magistrale ---------- */
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.node{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 8px;position:relative}
.node:before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--line)}
.node:first-child:before{top:14px} .node:last-child:before{bottom:calc(100% - 14px)}
.node .pos{position:relative;z-index:1;width:26px;height:26px;margin:2px 4px;border-radius:50%;background:var(--raised);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;font-weight:600}
.node-b{padding:0 0 10px;min-width:0}
.node-h{display:flex;gap:8px;align-items:baseline;padding:5px 0 3px}
.node .grp{border-radius:4px}

/* ---------- szafa ---------- */
.strip{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.strip.n8{grid-template-columns:repeat(8,minmax(0,1fr))} .strip.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.strip{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cell{border:1px solid var(--line);border-radius:3px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:11px;min-width:0;background:var(--raised)}
.cell b{font-weight:600}
.cell .w{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cell .glyph{width:14px;height:14px}
.c-map{background:var(--accent-soft);border-color:var(--accent)} .c-d12{background:var(--warn-soft);border-style:dashed}
.c-ws{background:var(--hold-soft);border-style:dashed} .c-rez{background:var(--na-soft);border-style:dashed} .c-blad,.c-niezmap{background:var(--bad-soft);border-color:var(--bad)}
tr.t-free td{color:var(--muted)}

/* ---------- pytania, pomiary, dokument ---------- */
.q{display:flex;flex-direction:column;gap:8px}
.q-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.q-h .qid{font-size:19px}
.md{display:flex;flex-direction:column;gap:10px;font-size:14px;min-width:0}
.md ul,.md ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.md pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.4}
.md blockquote{margin:0;padding:6px 12px;border-left:3px solid var(--line);color:var(--muted)}
.md table{min-width:480px}
.toc{display:flex;flex-wrap:wrap;gap:5px}
/* ---------- wersja online: ekran połączenia i znacznik synchronizacji ---------- */
.brama{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.brama .card{width:min(470px,100%);gap:14px;padding:20px}
.brama label{display:flex;flex-direction:column;gap:4px}
.brama .err{color:var(--bad);font-weight:600;font-size:13.5px}
.brama ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.brama summary{cursor:pointer;font-weight:600}
.syncb{position:fixed;right:12px;bottom:12px;z-index:30;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;display:none;align-items:center;gap:7px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.syncb i{width:8px;height:8px;border-radius:50%;background:var(--na);display:block;flex:none}
.syncb.s-ok i{background:var(--ok)} .syncb.s-czeka i{background:var(--warn)} .syncb.s-blad i{background:var(--bad)} .syncb.s-trwa i{background:var(--accent)}
@media (max-width:900px){.syncb{display:inline-flex} body.online .toast{bottom:58px}}
@media print{
  .side,.detail,.backdrop,.toast,.noprint,.syncb,.brama{display:none!important}
  .shell{display:block} .main{padding:0} body{background:#fff}
}

/* markdown w jednej linii: `kod`, **pogrubienie**, ~~skreślenie~~, *kursywa*, odnośniki C6m / D9 / A4 */

  if(!bezOdn)h=h.replace(/\b([A-G]\d{1,2}[a-z]?|Q\d)\b(?! do \+)/g,function(m){return odn(m);});

/* markdown blokowy dla sekcji dokumentu */
function blk(src){
  var L=String(src||"").split(/\r?\n/),out=[],i=0,l;
  function start(x){return /^(```|#{3,5}\s|\||\s*[-*]\s+|\s*\d+\.\s+|>)/.test(x);}
  while(i<L.length){
    l=L[i];
    if(/^\s*$/.test(l)||/^---+\s*$/.test(l)){i++;continue;}
    if(/^```/.test(l)){var c=[];i++;while(i<L.length&&!/^```/.test(L[i])){c.push(L[i]);i++;}i++;out.push("<pre>"+esc(c.join("\n"))+"</pre>");continue;}
    var mh=l.match(/^(#{3,5})\s+(.*)$/);
    if(mh){out.push((mh[1].length<=4?"<h3>":"<h4>")+inl(mh[2])+(mh[1].length<=4?"</h3>":"</h4>"));i++;continue;}
    if(/^\|/.test(l)){var rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++;}
      var cells=function(r){return r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(x){return x.trim();});};
      var th=cells(rows[0]),body=rows.slice(2).map(cells);
      out.push('<div class="tw"><table><thead><tr>'+th.map(function(x){return "<th>"+inl(x)+"</th>";}).join("")+"</tr></thead><tbody>"+body.map(function(r){return "<tr>"+r.map(function(x){return "<td>"+inl(x)+"</td>";}).join("")+"</tr>";}).join("")+"</tbody></table></div>");continue;}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){var ol=/^\s*\d+\./.test(l),items=[];
      while(i<L.length&&(/^\s*([-*]|\d+\.)\s+/.test(L[i])||(/^\s{2,}\S/.test(L[i])&&items.length))){
        if(/^\s*([-*]|\d+\.)\s+/.test(L[i]))items.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,""));else items[items.length-1]+=" "+L[i].trim();i++;}
      out.push((ol?"<ol>":"<ul>")+items.map(function(x){return "<li>"+inl(x)+"</li>";}).join("")+(ol?"</ol>":"</ul>"));continue;}
    if(/^>/.test(l)){var b=[];while(i<L.length&&/^>/.test(L[i])){b.push(L[i].replace(/^>\s?/,""));i++;}out.push("<blockquote>"+inl(b.join(" "))+"</blockquote>");continue;}
    var p=[l];i++;while(i<L.length&&!/^\s*$/.test(L[i])&&!start(L[i])){p.push(L[i]);i++;}
    out.push("<p>"+inl(p.join(" "))+"</p>");
  }
  return '<div class="md">'+out.join("")+"</div>";
}

function pasuje(d){
  if(UI.floor!=="all"&&d.pietro!==UI.floor)return false;

  if(UI.filt==="obiekt"&&etap(d,E.montaz).s!=="ok")return false;

  if(UI.filt==="blok"&&!(d.auto.dane.s==="blok"||d.auto.dane.s==="brak"||d.auto.program.s==="brak"))return false;
  if(UI.filt==="ust"&&!maUsterke(d))return false;

<script>
/* ---------- rozruch; w wersji online także token, dane i stan z GitHuba ----------
   Wersja jednoplikowa ma dane wklejone przez generator i startuje od razu.
   Skorupa online nie zawiera żadnych danych: pobiera aplikacja/dane.json
   i aplikacja/stan.json z prywatnego repozytorium przez API GitHuba. */
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function two(n){return (n<10?"0":"")+n;}
var motyw=ls("bm-motyw");if(motyw)document.documentElement.setAttribute("data-theme",motyw);
if(window.DANE){window.BM_start();return;}

/* Na komputerze deweloperskim rozmawiamy z atrapą API pod tym samym adresem
   (aplikacja/narzedzia/serwer_testowy.py). Adresu API nie da się podać z zewnątrz —
   inaczej spreparowany odnośnik mógłby wysłać token w obce miejsce. */
var LOK=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
var API=LOK?location.origin+"/_github":"https://api.github.com";
var KAT="aplikacja", K_POL="bm-polaczenie", CN="bm-dane-v1";
var POL=null, wpisaneRepo="";
try{var zap=JSON.parse(ls(K_POL)||"null");if(zap&&zap.repo&&zap.token)POL=zap;}catch(e){}
var S={start:false,stan:"",kiedy:0,blad:"",trwa:false,ponow:false,pomin:false,sha:null,noweDane:"",daneTxt:"",tDeb:0,tDane:0};

function Blad(kod,msg){var e=new Error(msg);e.kod=kod;return e;}
function opisBledu(kod,m){
  if(kod===401)return "GitHub odrzucił token — wygasł albo jest błędny.";
  if(kod===403)return /rate limit/i.test(m)?"Limit zapytań GitHuba — spróbuj za kilka minut.":"Token nie ma uprawnień do tego repozytorium. Potrzebne: Contents — Read and write.";
  if(kod===404)return "Nie znaleziono repozytorium albo pliku. Sprawdź nazwę repozytorium i zakres tokenu.";
  return "Błąd GitHuba "+kod+(m?": "+m:"");
}
function zOdp(r){return r.text().then(function(t){var m="";try{m=JSON.parse(t).message||"";}catch(e){}throw Blad(r.status,opisBledu(r.status,m));});}
function b64dec(s){var bin=atob(String(s).replace(/\s/g,"")),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(u);}
function b64enc(s){var u=new TextEncoder().encode(s),bin="";for(var i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin);}
function sciezka(p){return p.split("/").map(encodeURIComponent).join("/");}
function gh(metoda,plik,op){
  op=op||{};
  var hd={"Authorization":"Bearer "+POL.token,"Accept":op.raw?"application/vnd.github.raw+json":"application/vnd.github+json"};
  var init={method:metoda,headers:hd,cache:op.cache||"no-store"};
  if(op.body){hd["Content-Type"]="application/json";init.body=JSON.stringify(op.body);}
  return fetch(API+"/repos/"+sciezka(POL.repo)+"/contents/"+sciezka(plik),init).catch(function(){throw Blad(0,"Brak połączenia z GitHubem.");});
}
function pobierzDane(){return gh("GET",KAT+"/dane.json",{raw:true,cache:"no-cache"}).then(function(r){return r.ok?r.text():zOdp(r);});}
function pobierzStan(){
  return gh("GET",KAT+"/stan.json").then(function(r){
    if(r.status===404)return {sha:null,wpisy:{}};
    if(!r.ok)return zOdp(r);
    return r.json().then(function(j){var o=JSON.parse(b64dec(j.content));return {sha:j.sha,wpisy:(o&&o.wpisy)||{}};});
  });
}

/* kopia danych na urządzeniu — żeby strona otwierała się bez zasięgu */
function cKlucz(n){return location.origin+"/_bm/"+encodeURIComponent(POL.repo)+"/"+n;}
function cGet(n){if(!window.caches)return Promise.resolve(null);return caches.open(CN).then(function(c){return c.match(cKlucz(n));}).then(function(r){return r?r.text():null;}).catch(function(){return null;});}
function cPut(n,txt){if(!window.caches)return Promise.resolve();return caches.open(CN).then(function(c){return c.put(cKlucz(n),new Response(txt,{headers:{"Content-Type":"application/json"}}));}).catch(function(){});}

/* ---------- ekran połączenia ---------- */
function pokazBrame(html){document.querySelector(".shell").hidden=true;var b=$("brama");b.hidden=false;b.innerHTML=html;}
function ekran(txt){pokazBrame('<div class="card"><span class="eyebrow">Stan uruchomienia BMS</span><p>'+esc(txt)+"</p></div>");}
function brama(err){
  var repo=wpisaneRepo||(POL&&POL.repo)||"";
  if(!repo){try{repo=new URLSearchParams(location.search).get("repo")||"";}catch(e){}}
  pokazBrame('<form class="card" id="brama-f" autocomplete="off"><div class="head"><span class="eyebrow">Stan uruchomienia BMS</span><h1>Połącz z repozytorium</h1></div>'+
    '<p class="sub">Ta strona nie zawiera żadnych danych. Listę urządzeń i stan obiektu pobiera z prywatnego repozytorium na GitHubie, po podaniu tokenu.</p>'+
    '<label><span class="lbl">Repozytorium</span><input class="field mono" id="b-repo" placeholder="wlasciciel/nazwa" value="'+esc(repo)+'" autocapitalize="off" autocorrect="off" spellcheck="false"></label>'+
    '<label><span class="lbl">Token dostępu</span><input class="field mono" id="b-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>'+
    (err?'<p class="err" role="alert">'+esc(err)+"</p>":"")+
    '<div class="rowf"><button class="btn primary" type="submit">Połącz</button><span class="sub" id="b-stan"></span></div>'+
    '<details class="sub"><summary>Skąd wziąć token</summary><ol><li>GitHub: Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li><li>Repository access: Only select repositories — wybierz to jedno repozytorium.</li><li>Permissions → Repository permissions → Contents: Read and write.</li><li>Wklej token tutaj. Zostaje w pamięci tej przeglądarki; usuwa go „Odłącz to urządzenie” w widoku Dane i raport.</li></ol></details></form>');
  $("brama-f").addEventListener("submit",function(e){e.preventDefault();polacz();});
}
function polacz(){
  var repo=$("b-repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,""),tok=$("b-token").value.trim();
  wpisaneRepo=repo;
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){brama("Podaj repozytorium w postaci właściciel/nazwa.");return;}
  if(!tok){brama("Wklej token dostępu.");return;}
  POL={repo:repo,token:tok};$("b-stan").textContent="Łączę…";
  pobierzDane().then(function(txt){return pobierzStan().then(function(zd){
    lsSet(K_POL,JSON.stringify(POL));cPut("dane.json",txt);cPut("baza.json",JSON.stringify(zd));
    try{history.replaceState(null,"",location.pathname+location.hash);}catch(e){}
    S.pomin=true;
    if(!uruchom(txt,zd))throw Blad(-1,"Plik aplikacja/dane.json ma nieznany format. Uruchom generator i zrób commit.");
  });}).catch(function(e){if(!S.start)POL=null;brama(e&&e.message||String(e));});
}

/* ---------- start aplikacji ---------- */
function uruchom(daneTxt,baza){
  var d=null;try{d=JSON.parse(daneTxt);}catch(e){}
  if(!d||!d.urz||!d.meta)return false;
  window.DANE=d;S.daneTxt=daneTxt;
  window.STAN_BAZA={wpisy:(baza&&baza.wpisy)||{}};S.sha=baza?baza.sha:null;
  window.BM_KLUCZ="bm-stan:"+POL.repo;
  $("brama").hidden=true;$("brama").innerHTML="";document.querySelector(".shell").hidden=false;document.body.classList.add("online");
  window.BM_start();
  return true;
}
function boot(){
  if(!POL){brama();return;}
  ekran("Wczytuję dane…");
  Promise.all([cGet("dane.json"),cGet("baza.json")]).then(function(r){
    var baza=null;try{baza=r[1]?JSON.parse(r[1]):null;}catch(e){}
    if(r[0]&&uruchom(r[0],baza))return;
    return pobierzDane().then(function(txt){return pobierzStan().then(function(zd){
      cPut("dane.json",txt);cPut("baza.json",JSON.stringify(zd));S.pomin=true;
      if(!uruchom(txt,zd))throw Blad(-1,"Plik aplikacja/dane.json ma nieznany format. Uruchom generator i zrób commit.");
    });});
  }).catch(function(e){if(!S.start)brama(e&&e.message||String(e));});
}

/* ---------- synchronizacja stanu ---------- */
function czeka(){return S.start?window.BM_app.zmienione().length:0;}
function opis(){
  var n=czeka();
  if(S.trwa)return "Wysyłam…";
  if(S.stan==="token")return "Token odrzucony";
  if(S.stan==="blad")return "Błąd zapisu"+(n?" · czeka: "+n:"");
  if(S.stan==="offline")return "Bez sieci"+(n?" · czeka: "+n:"");
  if(n)return "Do wysłania: "+n;
  var d=new Date(S.kiedy);
  return S.kiedy?"Zapisane · "+two(d.getHours())+":"+two(d.getMinutes()):"Stan z pamięci urządzenia";
}
function maluj(){
  var b=$("syncb"),n=czeka();
  if(b){b.hidden=!S.start;b.className="syncb "+(S.trwa?"s-trwa":(S.stan==="blad"||S.stan==="token")?"s-blad":(n||S.stan==="offline")?"s-czeka":"s-ok");b.innerHTML="<i></i>"+esc(opis());}
  ["syncs","syncs2"].forEach(function(id){var e=$(id);if(e)e.textContent=opis();});
}
function planuj(ms){clearTimeout(S.tDeb);S.tDeb=setTimeout(function(){sync(false);},ms);}
function zmiana(){maluj();planuj(20000);}
/* Jedna próba: pobierz stan z repozytorium, scal z wpisami z tego urządzenia
   (nowszy wygrywa), wyślij. Gdy w międzyczasie ktoś zapisał plik, GitHub
   odrzuca zapis (409) i próba idzie od początku. */
function proba(n){
  return pobierzStan().then(function(zd){
    S.sha=zd.sha;window.BM_app.ustawBaze(zd.wpisy);cPut("baza.json",JSON.stringify(zd));
    var kl=window.BM_app.zmienione();
    if(!kl.length)return 0;
    var ex=window.BM_app.eksport(),txt=JSON.stringify(ex,null,2)+"\n";
    var body={message:"Stan obiektu: "+kl.slice(0,4).join(", ")+(kl.length>4?" (+"+(kl.length-4)+")":"")+"\n\nZapis z aplikacji online.",content:b64enc(txt)};
    if(zd.sha)body.sha=zd.sha;
    return gh("PUT",KAT+"/stan.json",{body:body}).then(function(r){
      if((r.status===409||r.status===422)&&n<3)return proba(n+1);
      if(!r.ok)return zOdp(r);
      return r.json().then(function(j){
        S.sha=(j&&j.content&&j.content.sha)||null;
        window.BM_app.ustawBaze(ex.wpisy);cPut("baza.json",JSON.stringify({sha:S.sha,wpisy:ex.wpisy}));
        return kl.length;
      });
    });
  });
}
function sync(reczne){
  if(!S.start)return;
  if(S.trwa){S.ponow=true;return;}
  clearTimeout(S.tDeb);S.trwa=true;maluj();
  proba(0).then(function(n){
    S.trwa=false;S.stan="ok";S.blad="";S.kiedy=Date.now();
    window.BM_app.odswiez();maluj();
    if(reczne||n)window.BM_app.toast(n?"Wysłano wpisów: "+n:"Wszystko jest zapisane");
    if(S.ponow||czeka()){S.ponow=false;planuj(3000);}
  },function(e){
    S.trwa=false;S.ponow=false;S.blad=(e&&e.message)||String(e);S.stan=e&&e.kod===0?"offline":e&&e.kod===401?"token":"blad";
    window.BM_app.odswiez();maluj();
    if(reczne)window.BM_app.toast(S.blad);
    if(czeka()&&S.stan!=="token")planuj(120000);
  });
}
function odswiezDane(){
  if(Date.now()-S.tDane<300000)return;S.tDane=Date.now();
  pobierzDane().then(function(txt){
    if(txt===S.daneTxt)return;
    var w="";try{w=JSON.parse(txt).meta.wygenerowano||"";}catch(e){return;}
    cPut("dane.json",txt);S.noweDane=w||"przed chwilą";window.BM_app.odswiez();
  }).catch(function(){});
}
function odlacz(){
  lsSet(K_POL,null);
  var p=window.caches?caches.delete(CN):Promise.resolve();
  p.then(function(){location.reload();},function(){location.reload();});
}

window.BM_on={
  opis:opis, zmiana:zmiana, sync:sync, odlacz:odlacz,
  info:function(){return {repo:POL.repo,blad:S.blad,noweDane:S.noweDane};},
  gotowa:function(){
    S.start=true;
    if(S.pomin){S.pomin=false;S.stan="ok";S.kiedy=Date.now();S.tDane=Date.now();maluj();if(czeka())planuj(3000);}
    else{maluj();sync(false);odswiezDane();}
  }
};
window.addEventListener("online",function(){if(S.start)sync(false);});
window.addEventListener("offline",function(){if(S.start){S.stan="offline";maluj();}});
document.addEventListener("visibilitychange",function(){if(!S.start||document.hidden)return;if(Date.now()-S.kiedy>60000)sync(false);odswiezDane();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
boot();
})();
</script>
</body>
</html>
